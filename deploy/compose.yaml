services:
  postgres:
    platform: linux/amd64
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cinekros
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: cinekros-api:local
    restart: unless-stopped
    env_file:
      - ${CINEKROS_API_ENV_FILE:-./api.env.example}
    environment:
      CINEKROS_DATABASE_CONNECTION_STRING_FILE: /run/secrets/database_connection_string
      CINEKROS_GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      ASPNETCORE_HTTP_PORTS: "8080"
    secrets:
      - database_connection_string
      - gemini_api_key
    volumes:
      - type: bind
        source: ${CINEKROS_MODEL_HOST_DIR:-../database/data/models/multilingual-e5-base/d128750597153bb5987e10b1c3493a34e5a4502a}
        target: /models
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
      - egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  cloudflared:
    platform: linux/amd64
    image: cloudflare/cloudflared:2026.10.0
    profiles:
      - public
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ${CINEKROS_CLOUDFLARED_CONFIG:-./cloudflared/config.example.yml}:/etc/cloudflared/config.yml:ro
    secrets:
      - source: cloudflared_credentials
        target: cloudflared_credentials.json
    depends_on:
      api:
        condition: service_healthy
    networks:
      - egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_admin_password:
    file: ${CINEKROS_POSTGRES_ADMIN_PASSWORD_FILE:-./postgres-admin-password.example}
  database_connection_string:
    file: ${CINEKROS_DATABASE_CONNECTION_STRING_FILE:-./database-connection.example}
  gemini_api_key:
    file: ${CINEKROS_GEMINI_API_KEY_FILE:-./gemini-api-key.example}
  cloudflared_credentials:
    file: ${CINEKROS_CLOUDFLARED_CREDENTIALS_FILE:-./cloudflared-credentials.example.json}

volumes:
  postgres-data:
    name: cinekros-postgres-data

networks:
  database:
    internal: true
  egress:
    driver: bridge
