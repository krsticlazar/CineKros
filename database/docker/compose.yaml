name: cinekros

services:
  cinekros-postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: cinekros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinekros
      POSTGRES_USER: cinekros
      POSTGRES_PASSWORD: ${CINEKROS_POSTGRES_PASSWORD:?Set CINEKROS_POSTGRES_PASSWORD in the process environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cinekros_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  cinekros_pgdata:
    name: cinekros_pgdata
